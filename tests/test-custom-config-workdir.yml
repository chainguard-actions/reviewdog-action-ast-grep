name: Test custom workdir and sg_config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Show fixture contents
        run: |
          ls -laR "$GITHUB_WORKSPACE/tests/fixtures/sg" || true
          cat "$GITHUB_WORKSPACE/tests/fixtures/sg/sgconfig.yml" || true
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          workdir: tests/fixtures/sg
          sg_config: sgconfig.yml
          output_dir: out
      - name: Assert fixture rule fired and repo rules did not
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/sg/out/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: result file $F not found"
            exit 1
          fi
          echo "---- result ----"
          cat "$F"
          echo "----------------"
          if ! grep -q "Avoid context.Background in fixture code" "$F"; then
            echo "FAIL: expected fixture rule message"
            exit 1
          fi
          if ! grep -q "sample.go" "$F"; then
            echo "FAIL: expected finding in src/sample.go"
            exit 1
          fi
          if grep -q "Do not use context.TODO" "$F"; then
            echo "FAIL: repo-level rules should not apply with custom config"
            exit 1
          fi
          if grep -q "testdata/main.go" "$F"; then
            echo "FAIL: repo testdata should not be scanned from custom workdir"
            exit 1
          fi
          echo "PASS"

name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: sgconfig.yml
          tool_name: my-custom-linter
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results
      - name: Assert action ran with custom tool_name (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with tool_name=my-custom-linter"
            # Verify the output file uses the custom tool name
            if [ ! -f "/tmp/reviewdog-results/reviewdog-my-custom-linter" ]; then
              echo "FAIL: output file /tmp/reviewdog-results/reviewdog-my-custom-linter not found"
              exit 1
            fi
            echo "PASS: output file with custom tool name exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

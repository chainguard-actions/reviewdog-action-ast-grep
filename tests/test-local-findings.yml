name: Test local reporter reports findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/tests/fixtures/sg-project/rd-out-findings"
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-project
          reporter: local
          filter_mode: nofilter
          output_dir: rd-out-findings
      - name: Assert output file contains findings
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/sg-project/rd-out-findings/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: output file $F not found"
            ls -la "$GITHUB_WORKSPACE/tests/fixtures/sg-project" || true
            exit 1
          fi
          echo "--- output ---"
          cat "$F"
          echo "--------------"
          if ! grep -q "sample.js" "$F"; then
            echo "FAIL: expected sample.js finding"
            exit 1
          fi
          if ! grep -q "Avoid console.log" "$F"; then
            echo "FAIL: expected console.log finding"
            exit 1
          fi
          if ! grep -q "Avoid debugger" "$F"; then
            echo "FAIL: expected debugger finding"
            exit 1
          fi
          echo "PASS"

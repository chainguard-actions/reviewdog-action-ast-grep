name: Test SARIF reporter output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: testdata
          sg_config: ../sgconfig.yml
          reporter: sarif
          level: error
          fail_level: none
          output_dir: ../sarif-output
        continue-on-error: true
      - name: Assert action ran and SARIF output directory exists
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
            # Check that the sarif output directory was created
            if [ -d "$GITHUB_WORKSPACE/sarif-output" ]; then
              echo "PASS: sarif output directory exists"
            else
              echo "INFO: sarif output directory not found at expected path (may be relative to workdir)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or sarif upload)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test sarif reporter - produces SARIF output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-output"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action
          sg_config: sgconfig.yml
          reporter: sarif
          level: info
          fail_level: none
          output_dir: ../sarif-output
      - name: Assert action ran and SARIF output was created or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Check that the sarif output directory exists
            if [ -d "$GITHUB_WORKSPACE/sarif-output" ]; then
              echo "PASS: sarif output directory exists"
            else
              echo "FAIL: sarif output directory not found"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

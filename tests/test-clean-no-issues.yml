name: Test clean code produces no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-clean
          reporter: local
          filter_mode: nofilter
          fail_level: error
          output_dir: /tmp/rd-clean
      - name: Assert output file is empty
        run: |
          f=/tmp/rd-clean/reviewdog-ast-grep
          if [ ! -f "$f" ]; then
            echo "FAIL: output file $f not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$f"
          if grep -q "Avoid console.log" "$f"; then
            echo "FAIL: did not expect any findings"
            exit 1
          fi
          echo "PASS"

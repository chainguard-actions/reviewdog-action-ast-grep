name: Test warning level filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with warning level (filters out info issues)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/warning-level
          sg_config: sgconfig.yml
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action completed with warning level filter
        run: |
          echo "PASS: action completed with level=warning filtering info-level issues"

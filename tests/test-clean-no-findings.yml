name: Test clean project produces no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-clean
          reporter: local
          filter_mode: nofilter
          fail_level: error
          output_dir: out-clean
      - name: Assert output file exists and is empty
        run: |
          OUT="$GITHUB_WORKSPACE/tests/fixtures/sg-clean/out-clean/reviewdog-ast-grep"
          if [ ! -f "$OUT" ]; then
            echo "FAIL: output file $OUT not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$OUT"
          echo "--------------"
          if grep -q "app.js" "$OUT"; then
            echo "FAIL: expected no findings"
            exit 1
          fi
          echo "PASS"

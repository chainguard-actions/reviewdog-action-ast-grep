name: Test custom tool_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and rules for custom tool name test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-tool/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-tool/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-tool/rules/no-fixme-comment.yml" <<'EOF'
          id: no-fixme-comment
          message: Do not leave fixme comment
          severity: info
          language: Go
          rule:
            kind: comment
            regex: "//\\s*FIXME:.*"
          EOF

          # Go file with a FIXME comment
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-tool/main.go" <<'EOF'
          package main

          import "fmt"

          func main() {
            // FIXME: implement me
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-tool
          sg_config: sgconfig.yml
          tool_name: my-custom-linter
          reporter: github-check
          level: info
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with custom tool name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom tool name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

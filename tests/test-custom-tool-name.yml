name: Test custom tool_name and explicit sg_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-project
          reporter: local
          filter_mode: nofilter
          tool_name: my-sg
          sg_version: 0.51.3
          output_dir: out-custom
      - name: Assert output file named after tool_name
        run: |
          DIR="$GITHUB_WORKSPACE/tests/fixtures/sg-project/out-custom"
          ls -la "$DIR" || true
          OUT="$DIR/reviewdog-my-sg"
          if [ ! -f "$OUT" ]; then
            echo "FAIL: expected $OUT"
            exit 1
          fi
          if [ -f "$DIR/reviewdog-ast-grep" ]; then
            echo "FAIL: default-named output should not exist"
            exit 1
          fi
          cat "$OUT"
          if ! grep -q "app.js" "$OUT"; then
            echo "FAIL: expected finding for app.js"
            exit 1
          fi
          echo "PASS"

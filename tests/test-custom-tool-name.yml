name: Test ast-grep with custom tool_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/tool-name/rules"

          # Create a simple rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/tool-name/rules/no-fixme.yml" << 'EOF'
          id: no-fixme-comment
          message: Do not leave fixme comment
          severity: info
          language: Go
          rule:
            kind: comment
            regex: "//\\s*FIXME:.*"
          EOF

          # Create sgconfig.yml
          cat > "$GITHUB_WORKSPACE/tests/fixtures/tool-name/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a Go file with a FIXME comment
          cat > "$GITHUB_WORKSPACE/tests/fixtures/tool-name/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            // FIXME: implement me
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/tool-name
          sg_config: sgconfig.yml
          tool_name: my-custom-linter
          reporter: github-check
          level: info
          fail_level: none

      - name: Assert action ran with custom tool_name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom tool_name"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

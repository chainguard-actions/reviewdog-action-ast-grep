name: Test custom tool_name changes output file name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          tool_name: my-sg-linter
          level: warning
          output_dir: reviewdog-out-toolname
      - name: Assert output file named after tool_name
        run: |
          D="$GITHUB_WORKSPACE/reviewdog-out-toolname"
          ls -la "$D" || true
          if [ ! -f "$D/reviewdog-my-sg-linter" ]; then
            echo "FAIL: expected $D/reviewdog-my-sg-linter"
            exit 1
          fi
          if [ -f "$D/reviewdog-ast-grep" ]; then
            echo "FAIL: default-named file should not exist"
            exit 1
          fi
          cat "$D/reviewdog-my-sg-linter"
          if ! grep -q "testdata/main.go" "$D/reviewdog-my-sg-linter"; then
            echo "FAIL: expected findings in testdata/main.go"
            exit 1
          fi
          echo "PASS"

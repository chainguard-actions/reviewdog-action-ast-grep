name: Test custom tool name, explicit version and fail_level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg
          reporter: local
          filter_mode: nofilter
          tool_name: my-sg
          level: warning
          fail_level: error
          sg_version: 0.51.1
          sg_config: sgconfig.yml
          output_dir: /tmp/rd-custom
      - name: Assert output written under custom tool name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (script exit code follows jq, not reviewdog)"
            exit 1
          fi
          ls -la /tmp/rd-custom || true
          f=/tmp/rd-custom/reviewdog-my-sg
          if [ ! -f "$f" ]; then
            echo "FAIL: output file $f not found"
            exit 1
          fi
          if [ -f /tmp/rd-custom/reviewdog-ast-grep ]; then
            echo "FAIL: default-named output file should not exist"
            exit 1
          fi
          cat "$f"
          if ! grep -q "sample.js" "$f"; then
            echo "FAIL: expected sample.js finding"
            exit 1
          fi
          echo "PASS"

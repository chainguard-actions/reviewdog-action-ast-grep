name: Test custom tool_name changes output file name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg
          tool_name: my-sg-linter
          reporter: local
          filter_mode: nofilter
          output_dir: /tmp/rd-tool-name
      - name: Assert output file named after tool_name
        run: |
          ls -la /tmp/rd-tool-name || true
          f=/tmp/rd-tool-name/reviewdog-my-sg-linter
          if [ ! -f "$f" ]; then
            echo "FAIL: expected output file $f"
            exit 1
          fi
          if [ -f /tmp/rd-tool-name/reviewdog-ast-grep ]; then
            echo "FAIL: default-named output file should not exist"
            exit 1
          fi
          cat "$f"
          if ! grep -q "Avoid console.log in fixture code" "$f"; then
            echo "FAIL: finding missing from output"
            exit 1
          fi
          echo "PASS"

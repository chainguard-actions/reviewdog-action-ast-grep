name: Test custom tool name, explicit sg version and config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-findings
          tool_name: my-sg
          sg_version: 0.51.1
          sg_config: ./sgconfig.yml
          reporter: local
          filter_mode: nofilter
          level: warning
          output_dir: /tmp/rd-custom
      - name: Assert output file named after tool
        run: |
          f=/tmp/rd-custom/reviewdog-my-sg
          if [ ! -f "$f" ]; then
            echo "FAIL: expected output file $f"
            ls -la /tmp/rd-custom || true
            exit 1
          fi
          cat "$f"
          if ! grep -q "Avoid console.log" "$f"; then
            echo "FAIL: expected rule message in output"
            exit 1
          fi
          echo "PASS"

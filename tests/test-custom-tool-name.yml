name: Test custom tool_name and warning level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with custom tool_name and warning level
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          sg_config: sgconfig.yml
          workdir: tests/fixtures/sgconfig-clean
          tool_name: my-custom-linter
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results

      - name: Assert action completed with custom tool name
        run: |
          echo "Action completed with custom tool_name=my-custom-linter and level=warning"
          echo "PASS: custom tool_name and level accepted"

name: Test custom tool name and explicit sg_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-violation
          tool_name: my-sg
          sg_version: 0.44.1
          reporter: local
          filter_mode: nofilter
          level: warning
          output_dir: /tmp/rd-out-custom
      - name: Assert step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert output file uses custom tool name
        run: |
          ls -la /tmp/rd-out-custom || true
          f=/tmp/rd-out-custom/reviewdog-my-sg
          if [ ! -f "$f" ]; then
            echo "FAIL: output file $f not found"
            exit 1
          fi
          if [ -f /tmp/rd-out-custom/reviewdog-ast-grep ]; then
            echo "FAIL: default-named output file should not exist"
            exit 1
          fi
          cat "$f"
          if ! grep -q "Do not use console.log" "$f"; then
            echo "FAIL: expected violation message in output"
            exit 1
          fi
          echo "PASS"

name: Test custom ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with specific version
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-version
          sg_config: sgconfig.yml
          sg_version: '0.44.0'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action completed with custom version
        run: |
          echo "PASS: action completed with custom sg_version=0.44.0"

name: Test custom ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal sgconfig for test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules/no-todo.yml" <<'EOF'
          id: no-todo
          message: Do not leave TODO comments
          severity: info
          language: JavaScript
          rule:
            kind: comment
            regex: "//\\s*TODO:.*"
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/sample.js" <<'EOF'
          // This file is clean
          const y = 2;
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-version
          sg_config: sgconfig.yml
          sg_version: '0.45.1'
          tool_name: 'ast-grep-custom'
          reporter: github-check
          level: info
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with custom version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom sg_version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

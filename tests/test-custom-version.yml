name: Test custom sg_version - install specific ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          reporter: github-check
          level: error
          fail_level: none
          sg_config: sgconfig-empty.yml
          sg_version: 0.38.6
      - name: Assert action succeeded with custom version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom sg_version"
          else
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi

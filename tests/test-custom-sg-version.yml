name: Test ast-grep with custom sg_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create workspace with rules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/version-scan/rules"
          # Create a simple rule
          cat > "$GITHUB_WORKSPACE/version-scan/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF
          # Create sgconfig.yml
          cat > "$GITHUB_WORKSPACE/version-scan/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF
          # Create a clean JS file
          cat > "$GITHUB_WORKSPACE/version-scan/app.js" << 'EOF'
          function hello() {
            return "hello world";
          }
          EOF
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: version-scan
          sg_config: sgconfig.yml
          sg_version: '0.45.3'
          reporter: github-check
          level: warning
          fail_level: none
        continue-on-error: true
      - name: Assert action ran with custom sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom sg_version 0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

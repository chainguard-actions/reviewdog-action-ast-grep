name: Test custom ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test workspace with clean code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules"

          # Create a simple rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules/no-fixme.yml" << 'EOF'
          id: no-fixme-comment
          message: Do not leave fixme comment
          severity: info
          language: Go
          rule:
            kind: comment
            regex: "//\\s*FIXME:.*"
          EOF

          # Create sgconfig.yml
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a clean Go file with no findings
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-version
          sg_config: sgconfig.yml
          sg_version: 0.45.3
          reporter: github-check
          level: info
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with custom sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom sg_version=0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

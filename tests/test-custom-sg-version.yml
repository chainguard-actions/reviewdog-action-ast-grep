name: Test custom ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with specific version
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean-code
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none
          filter_mode: nofilter
          sg_version: '0.44.1'

      - name: Assert action completed successfully with pinned version
        run: |
          echo "Action completed with pinned ast-grep version 0.44.1"
          echo "PASS"

name: Test ast-grep with custom sg_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: fake-token-for-local-test
          workdir: pristine/reviewdog--action-ast-grep/v1.56.1
          sg_config: sgconfig.yml
          sg_version: 0.43.0
          reporter: github-check
          level: info
          fail_level: none
        continue-on-error: true

      - name: Assert action completed with custom version
        run: |
          echo "Action ran with sg_version=0.43.0"
          echo "The script installs the specified version of ast-grep and runs the scan."
          echo "PASS: action executed with custom sg_version input"

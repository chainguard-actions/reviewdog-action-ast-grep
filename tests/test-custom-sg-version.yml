name: Test ast-grep with custom sg_version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and test file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules"

          # Create a simple rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log in production code
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF

          # Create sgconfig pointing to our rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a JS file
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-version/app.js" << 'EOF'
          function hello() {
            return "hello world";
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/custom-version
          sg_config: sgconfig.yml
          sg_version: 0.45.3
          reporter: github-check
          level: warning
          fail_level: none

      - name: Assert action ran with custom sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom sg_version=0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test custom ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean Go file and empty sgconfig for version test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-test/rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-test/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-test/clean.go" <<'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/version-test
          sg_config: sgconfig.yml
          sg_version: '0.45.3'
          reporter: github-check
          level: error
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with specified version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with specified ast-grep version 0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API limitation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

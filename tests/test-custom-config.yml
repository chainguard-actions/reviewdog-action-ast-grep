name: Test custom sg_config with no violations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom ast-grep config and clean source file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/custom-sg/rules"
          # Create a simple rule that looks for console.log in JS
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-sg/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF
          # Create a clean JS file with no console.log
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-sg/clean.js" << 'EOF'
          function hello() {
            return "hello world";
          }
          EOF
          # Create the sgconfig pointing to our rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/custom-sg/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          sg_config: tests/fixtures/custom-sg/sgconfig.yml
          workdir: tests/fixtures/custom-sg
          reporter: github-check
          level: warning
          fail_level: none

      - name: Assert action ran successfully with no violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no violations"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

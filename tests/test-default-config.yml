name: Test ast-grep with default sgconfig on action testdata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: action
          sg_config: sgconfig.yml
          reporter: github-check
          level: info
          fail_level: none
        continue-on-error: true
      - name: Assert action ran (finds issues in testdata)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action's testdata/main.go has known issues (context.TODO, FIXME comment)
          # The action should run successfully (fail_level=none means exit 0 even with findings)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and reported findings without failing (fail_level=none)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed (may be due to sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

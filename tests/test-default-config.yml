name: Test default sgconfig with findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          # Use the action's own sgconfig.yml which points to testdata/rules
          # testdata/main.go has FIXME comments and context.TODO() calls
          sg_config: sgconfig.yml
          reporter: github-check
          level: info
          fail_level: none

      - name: Assert action completed successfully with findings
        run: |
          echo "Action completed - findings were reported but fail_level=none so exit 0"
          echo "PASS"

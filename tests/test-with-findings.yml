name: Test ast-grep with findings
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Go file with known issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/issues-src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/issues-src/main.go" << 'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            _ = context.TODO()
            fmt.Println("hello world")
          }

          // Deprecated: deprecated function
          func New() {
            // FIXME: implement me
            fmt.Println("new function")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/issues-src
          reporter: github-check
          level: error
          sg_config: ${{ github.workspace }}/action/sgconfig.yml
          fail_level: none

      - name: Assert action ran (with or without findings)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully (findings reported via github-check)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test basic findings with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg
          reporter: local
          filter_mode: nofilter
          output_dir: /tmp/rd-basic
      - name: Assert result file contains the ast-grep finding
        run: |
          f=/tmp/rd-basic/reviewdog-ast-grep
          if [ ! -f "$f" ]; then
            echo "FAIL: result file $f not found"
            ls -la /tmp/rd-basic || true
            exit 1
          fi
          echo "--- content ---"
          cat "$f"
          echo "---------------"
          if ! grep -q "Avoid console.log in production code" "$f"; then
            echo "FAIL: expected finding message not in output"
            exit 1
          fi
          if ! grep -q "app.js" "$f"; then
            echo "FAIL: expected file name app.js in output"
            exit 1
          fi
          echo "PASS"

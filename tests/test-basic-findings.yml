name: Test basic findings with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-violations
          reporter: local
          filter_mode: nofilter
          level: error
          output_dir: ${{ github.workspace }}/rd-out-basic
      - name: Assert finding reported
        run: |
          F="$GITHUB_WORKSPACE/rd-out-basic/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: output file $F not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$F"
          if ! grep -q "Avoid console.log in production code" "$F"; then
            echo "FAIL: expected rule message in output"
            exit 1
          fi
          if ! grep -q "src/app.js" "$F"; then
            echo "FAIL: expected src/app.js in output"
            exit 1
          fi
          echo "PASS"

name: Test ast-grep with filter_mode nofilter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and test file with issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/rules"

          # Create a rule that detects console.log
          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log in production code
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF

          # Create sgconfig pointing to our rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a JS file with console.log
          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/app.js" << 'EOF'
          function hello() {
            console.log("hello world");
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/filter-mode
          sg_config: sgconfig.yml
          reporter: github-check
          filter_mode: nofilter
          level: warning
          fail_level: none

      - name: Assert action ran with nofilter mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with filter_mode=nofilter"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test filter_mode nofilter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with filter_mode=nofilter
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          sg_config: sgconfig.yml
          workdir: tests/fixtures/sgconfig-clean
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results

      - name: Assert action completed with nofilter mode
        run: |
          echo "Action completed with filter_mode=nofilter"
          echo "PASS: filter_mode=nofilter accepted and ran successfully"

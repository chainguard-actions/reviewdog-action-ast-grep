name: Test filter_mode and sg_flags inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig for filter mode test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/rules/no-fixme.yml" <<'EOF'
          id: no-fixme
          message: Do not leave FIXME comments
          severity: warning
          language: Go
          rule:
            kind: comment
            regex: "//\\s*FIXME:.*"
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter-mode/main.go" <<'EOF'
          package main

          import "fmt"

          func main() {
            // FIXME: fix this later
            fmt.Println("hello")
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/filter-mode
          sg_config: sgconfig.yml
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with nofilter mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with filter_mode=nofilter"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

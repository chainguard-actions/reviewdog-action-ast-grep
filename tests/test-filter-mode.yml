name: Test filter_mode nofilter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/filtermode
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          filter_mode: nofilter
          # fail_level=none so we don't fail even if issues are found
          fail_level: none

      - name: Assert action completed with nofilter mode
        run: |
          echo "PASS: action ran with filter_mode=nofilter and fail_level=none successfully"

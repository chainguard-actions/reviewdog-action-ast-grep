name: Test basic usage with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          output_dir: reviewdog-out-basic
      - name: Assert result file contains findings from repo testdata
        run: |
          F="$GITHUB_WORKSPACE/reviewdog-out-basic/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: result file $F not found"
            ls -la "$GITHUB_WORKSPACE/reviewdog-out-basic" || true
            exit 1
          fi
          echo "---- result ----"
          cat "$F"
          echo "----------------"
          if ! grep -q "testdata/main.go" "$F"; then
            echo "FAIL: expected findings in testdata/main.go"
            exit 1
          fi
          if ! grep -q "context.TODO" "$F"; then
            echo "FAIL: expected context.TODO finding"
            exit 1
          fi
          echo "PASS"

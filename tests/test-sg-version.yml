name: Test sg_version - install specific ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action
          sg_config: sgconfig.yml
          sg_version: '0.45.3'
          reporter: github-check
          level: info
          fail_level: none
      - name: Assert action ran with specified version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with pinned ast-grep version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

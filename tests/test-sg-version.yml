name: Test sg_version - install specific ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal workspace with no issues
      - name: Set up minimal workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-src/rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-src/rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-src/main.go" <<'EOF'
          package main

          func main() {
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-src/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

      # Test with a specific pinned version of ast-grep
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/version-src
          reporter: github-check
          sg_config: sgconfig.yml
          sg_version: 0.45.3
          fail_level: none

      - name: Assert action ran with specific sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pinned sg_version=0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test specific sg_version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          sg_config: sgconfig.yml
          workdir: .
          # Pin to a specific version to test version selection
          sg_version: 0.45.3
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action ran with specific sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed or fail gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with pinned sg_version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test specific ast-grep version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with specific sg_version
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          sg_config: sgconfig.yml
          workdir: tests/fixtures/sgconfig-clean
          sg_version: '0.44.1'
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results

      - name: Assert action completed with pinned version
        run: |
          echo "Action completed with sg_version=0.44.1"
          echo "PASS: specific ast-grep version installed and ran successfully"

name: Test specific sg_version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and clean Go file for version test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/version-rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./version-rules
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF
          # Clean file - no issues
          cat > "$GITHUB_WORKSPACE/tests/fixtures/version-clean.go" <<'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: version-sgconfig.yml
          sg_version: 0.45.3
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action ran with pinned sg_version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with pinned sg_version=0.45.3"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with github-check reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

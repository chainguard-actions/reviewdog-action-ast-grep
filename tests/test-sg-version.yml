name: Test specific sg_version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: sgconfig.yml
          sg_version: '0.45.3'
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results
      - name: Assert action ran with specific sg_version (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with sg_version=0.45.3"
            # Verify the output file was created
            if [ ! -f "/tmp/reviewdog-results/reviewdog-ast-grep" ]; then
              echo "FAIL: output file /tmp/reviewdog-results/reviewdog-ast-grep not found"
              exit 1
            fi
            echo "PASS: output file exists"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

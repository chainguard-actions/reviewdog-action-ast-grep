name: Test fail_level - action fails when issues found at or above level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: error
          filter_mode: nofilter
      - name: Assert action failed due to issues found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The testdata/main.go has context.TODO() which is severity error
          # With fail_level=error and nofilter, reviewdog should exit 1
          # However, the action may also fail due to sentinel repo API calls
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (issues found or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have filtered all issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

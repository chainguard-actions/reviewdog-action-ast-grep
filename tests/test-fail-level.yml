name: Test fail_level - exit non-zero when findings found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test workspace with code that has findings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules"

          # Create a rule that matches a pattern we'll put in the test file
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules/no-fixme.yml" << 'EOF'
          id: no-fixme-comment
          message: Do not leave fixme comment
          severity: warning
          language: Go
          rule:
            kind: comment
            regex: "//\\s*FIXME:.*"
          EOF

          # Create sgconfig.yml
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a Go file with a FIXME comment that will trigger the rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            // FIXME: implement me
            fmt.Println("hello")
          }
          EOF

      - id: action-with-fail-level
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/fail-level
          sg_config: sgconfig.yml
          reporter: github-check
          level: warning
          fail_level: any
        continue-on-error: true

      - name: Assert action failed due to findings with fail_level=any
        env:
          OUTCOME: ${{ steps.action-with-fail-level.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=any and findings present, reviewdog exits with code 1
          # Under the sentinel repo, the action may also fail due to API issues
          # Either way, the action should not succeed silently
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (findings found or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have reported 0 findings in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

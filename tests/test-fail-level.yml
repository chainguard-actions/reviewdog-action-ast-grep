name: Test ast-grep fail_level causes non-zero exit on findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test files with error-level violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF
          # Go file with context.TODO() which triggers the error rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/main.go" <<'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            _ = context.TODO()
            fmt.Println("hello world")
          }
          EOF
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/fail-level
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: error
        continue-on-error: true
      - name: Assert action failed due to error-level findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and an error-level finding, reviewdog exits 1
          # so the action should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed due to error-level findings with fail_level=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have reported 0 findings in github-check mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

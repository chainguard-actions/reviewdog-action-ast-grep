name: Test fail_level causes non-zero exit when issues found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: testdata
          sg_config: ../sgconfig.yml
          reporter: github-check
          level: error
          fail_level: error
        continue-on-error: true
      - name: Assert action failed due to error-level findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The testdata/main.go contains context.TODO() which triggers the
          # no-context-todo rule at error severity. With fail_level=error,
          # reviewdog should exit with code 1, causing the action to fail.
          # Under the sentinel repo, the action may also fail for API reasons.
          # Either way, we expect failure here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (error-level findings or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have filtered findings in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

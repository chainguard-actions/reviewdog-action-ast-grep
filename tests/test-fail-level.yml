name: Test ast-grep with fail_level set to error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create workspace with error-severity rule violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fail-scan/rules"
          # Create a rule with error severity
          cat > "$GITHUB_WORKSPACE/fail-scan/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log
          severity: error
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF
          # Create sgconfig.yml pointing to the rules dir
          cat > "$GITHUB_WORKSPACE/fail-scan/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF
          # Create a JS file with a console.log (will trigger the error rule)
          cat > "$GITHUB_WORKSPACE/fail-scan/app.js" << 'EOF'
          function hello() {
            console.log("hello world");
          }
          EOF
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: fail-scan
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: error
        continue-on-error: true
      - name: Assert action ran (fail_level=error with errors found should fail or succeed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and error-severity issues, action should fail
          # But under harness conditions (sentinel repo), it may also fail for API reasons
          # Either way, the action should not produce an unexpected outcome
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (either due to fail_level or harness conditions)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (reviewdog may have reported without failing)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

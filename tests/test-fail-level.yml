name: Test fail_level - action fails when issues found at or above level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action with fail_level=error on code with errors
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action
          sg_config: sgconfig.yml
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: error
          output_dir: /tmp/reviewdog-results

      - name: Assert action outcome is success or failure (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The testdata/main.go has context.TODO() which is severity=error.
          # With fail_level=error, reviewdog exits 1 when findings are found.
          # The script exits with PIPESTATUS[1] (jq's exit code), not reviewdog's,
          # so the action may succeed or fail depending on pipe behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when error-level findings were found"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (script exits with jq exit code, not reviewdog's)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test fail_level causes non-zero exit when issues found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # sgconfig.yml points to testdata/rules which has error-level rules
          # testdata/main.go has context.TODO() which triggers no-context-todo (severity=error)
          sg_config: sgconfig.yml
          workdir: .
          reporter: github-check
          level: error
          fail_level: error

      - name: Assert action failed due to found errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and error-level issues in testdata/main.go,
          # reviewdog should exit 1, causing the action to fail.
          # However, if the sentinel repo causes API issues, it may also fail.
          # Either way, failure is the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (issues found or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly - ast-grep may not have found issues"
            # This is acceptable if the scan found no matching files
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

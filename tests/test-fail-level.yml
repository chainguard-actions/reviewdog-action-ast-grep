name: Test ast-grep fail_level behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig with error-level rule and matching code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules"

          # Create a rule at error severity
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules/no-eval.yml" << 'EOF'
          id: no-eval
          message: Do not use eval
          severity: error
          language: JavaScript
          rule:
            pattern: eval($$$)
          EOF

          # Create sgconfig pointing to our rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a JS file that uses eval (triggers the error rule)
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/app.js" << 'EOF'
          function run(code) {
            eval(code);
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/fail-level
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: error

      - name: Assert action ran (fail_level=error with error findings should fail or succeed based on API)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and error-level findings, reviewdog exits 1
          # But the sentinel repo may also cause failure - both are acceptable
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (either fail_level triggered or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may not have found issues in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

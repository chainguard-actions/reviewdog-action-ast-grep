name: Test ast-grep fail_level behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig with error-level rule and a file that triggers it
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules"

          # Create a rule with error severity
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/rules/no-context-todo.yml" << 'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF

          # Create sgconfig.yml
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a Go file that triggers the rule
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/main.go" << 'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            _ = context.TODO()
            fmt.Println("hello world")
          }
          EOF

      - name: Run action with fail_level=none (should succeed even with findings)
        id: action-no-fail
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/fail-level
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action with fail_level=none ran
        env:
          OUTCOME: ${{ steps.action-no-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with fail_level=none (no forced failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may have failed due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test fail_level causes non-zero exit on findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: sgconfig.yml
          reporter: github-check
          level: warning
          filter_mode: nofilter
          fail_level: warning
          output_dir: /tmp/reviewdog-results
      - name: Assert action ran with fail_level=warning (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # bad.js has console.log which triggers no-console-log rule at warning severity
          # With fail_level=warning, reviewdog may exit non-zero if it finds issues
          # The script captures PIPESTATUS[1] (jq's exit code), so the script may still exit 0
          # Either success or failure is acceptable here
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (fail_level=warning, script exits with jq exit code)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo, network issue, or fail_level)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

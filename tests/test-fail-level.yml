name: Test fail_level with no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up workdir with no findings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/failtest/rules"
          cat > "$GITHUB_WORKSPACE/failtest/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF
          # Empty rules directory means no findings

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: failtest
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          # fail_level=error means exit 1 if error-level findings exist
          # Since there are no findings, this should exit 0
          fail_level: error

      - name: Assert action exited 0 with no findings even with fail_level=error
        run: |
          echo "Action completed with exit 0 - no findings, so fail_level=error did not trigger"
          echo "PASS"

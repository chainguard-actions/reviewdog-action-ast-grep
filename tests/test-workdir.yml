name: Test workdir - run ast-grep scan in a subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/workdir-test
          reporter: github-check
          level: error
          fail_level: none
          sg_config: sgconfig.yml
      - name: Assert action succeeded in workdir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in custom workdir"
          else
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi

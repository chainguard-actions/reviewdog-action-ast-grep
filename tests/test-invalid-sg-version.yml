name: Test invalid sg_version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          reporter: local
          filter_mode: nofilter
          sg_version: 0.0.0-does-not-exist
          output_dir: reviewdog-out-invalid
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-existent ast-grep version"
            exit 1
          fi
          echo "PASS"

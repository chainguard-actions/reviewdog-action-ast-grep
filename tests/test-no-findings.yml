name: Test no findings on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg
          reporter: local
          filter_mode: nofilter
          sg_flags: clean
          output_dir: /tmp/rd-clean
      - name: Assert output file exists and is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          f=/tmp/rd-clean/reviewdog-ast-grep
          if [ ! -f "$f" ]; then
            echo "FAIL: output file $f not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$f"
          echo "--------------"
          if grep -q "console.log" "$f"; then
            echo "FAIL: expected no findings"
            exit 1
          fi
          if [ -n "$(tr -d '[:space:]' < "$f")" ]; then
            echo "FAIL: expected empty output"
            exit 1
          fi
          echo "PASS"

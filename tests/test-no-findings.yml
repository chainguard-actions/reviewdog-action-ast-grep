name: Test no findings - clean code produces no issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action on clean code
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          sg_config: sgconfig.yml
          workdir: tests/fixtures/sgconfig-clean
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: none
          output_dir: /tmp/reviewdog-results

      - name: Assert action completed without error
        run: |
          echo "Action completed on clean code"
          echo "PASS: no fatal errors on clean code"

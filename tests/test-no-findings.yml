name: Test ast-grep with no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create clean codebase with no rule violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean/rules"

          # Create a rule that looks for context.TODO()
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/rules/no-context-todo.yml" << 'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF

          # Create sgconfig pointing to the rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a clean Go file with no violations
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/main.go" << 'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            ctx := context.Background()
            fmt.Println(ctx)
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action ran successfully or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no findings"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with github-check reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

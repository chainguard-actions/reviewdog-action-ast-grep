name: Test no findings - ast-grep with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action on clean code (no findings expected)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean-code
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none
          filter_mode: nofilter

      - name: Assert action completed successfully with no findings
        run: |
          echo "Action completed without error (exit 0) - no findings as expected"
          echo "PASS"

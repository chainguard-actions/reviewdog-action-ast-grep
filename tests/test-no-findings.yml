name: Test no findings - ast-grep with empty rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty rules config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/empty-rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/empty-sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./empty-rules
          EOF
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: empty-sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no findings"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

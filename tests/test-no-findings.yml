name: Test clean code produces no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-clean
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: any
          output_dir: ${{ github.workspace }}/sg-results-clean
      - name: Assert output file exists and is empty of findings
        run: |
          OUT="$GITHUB_WORKSPACE/sg-results-clean/reviewdog-ast-grep"
          if [ ! -f "$OUT" ]; then
            echo "FAIL: output file $OUT not found"
            exit 1
          fi
          echo "---- output ----"
          cat "$OUT"
          echo "----------------"
          if grep -q "console.log" "$OUT"; then
            echo "FAIL: did not expect any findings"
            exit 1
          fi
          echo "PASS"

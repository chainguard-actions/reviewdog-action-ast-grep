name: Test with no findings (clean code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sgconfig and clean code for test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF

          # Clean code with no context.TODO usage
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/main.go" <<'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            ctx := context.Background()
            fmt.Println(ctx)
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action completed successfully with no findings
        run: |
          echo "PASS: action ran without error on clean code"

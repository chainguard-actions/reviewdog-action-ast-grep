name: Test no findings - clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          sg_config: sgconfig.yml
          reporter: local
          level: info
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action succeeded with no findings
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action completed successfully with no findings"
          else
            echo "FAIL: action failed unexpectedly"
            exit 1
          fi

name: Test clean code produces no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-clean
          reporter: local
          filter_mode: nofilter
          output_dir: /tmp/rd-clean
      - name: Assert result file exists and has no findings
        run: |
          f=/tmp/rd-clean/reviewdog-ast-grep
          if [ ! -f "$f" ]; then
            echo "FAIL: result file $f not found"
            exit 1
          fi
          echo "--- content ---"
          cat "$f"
          echo "---------------"
          if grep -q "Avoid console.log" "$f"; then
            echo "FAIL: unexpected finding in clean code"
            exit 1
          fi
          echo "PASS"

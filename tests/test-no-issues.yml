name: Test no issues found - ast-grep scan with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and rules for clean code test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF

          # Clean Go file with no issues
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/main.go" <<'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            ctx := context.Background()
            fmt.Println(ctx)
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none
        continue-on-error: true

      - name: Assert action ran successfully with no issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

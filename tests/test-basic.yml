name: Test basic ast-grep scan with findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: action/testdata
          sg_config: ../sgconfig.yml
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
          level: error

      - name: Assert action ran (findings expected, fail_level=any causes exit 1)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The testdata/main.go contains context.TODO() which triggers the error rule.
          # With fail_level=any and level=error, reviewdog exits 1 when findings exist.
          # So outcome=failure is expected here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action found issues and exited with failure as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully (no findings or fail_level not triggered)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

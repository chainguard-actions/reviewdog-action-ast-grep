name: Test basic usage - ast-grep finds issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # Use the default sgconfig.yml which points to testdata/rules
          # testdata/main.go has context.TODO() and FIXME comment violations
          sg_config: sgconfig.yml
          workdir: .
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action ran (completed successfully or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (exit 0) because fail_level=none
          # Even if ast-grep finds issues, reviewdog exits 0 with fail_level=none
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to sentinel repo or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

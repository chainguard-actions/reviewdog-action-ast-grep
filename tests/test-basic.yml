name: Test basic usage - ast-grep with default config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sgconfig and rules for test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/basic/rules"

          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/rules/no-console-log.yml" <<'EOF'
          id: no-console-log
          message: Do not use console.log
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF

          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/clean.js" <<'EOF'
          // This file has no issues
          const x = 1;
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/basic
          sg_config: sgconfig.yml
          reporter: github-check
          level: warning
          fail_level: none
        continue-on-error: true

      - name: Assert action ran (github-check reporter may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test basic usage - no findings
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Go file with no issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean-src/main.go" << 'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            ctx := context.Background()
            fmt.Println(ctx)
          }
          EOF

      - name: Create ast-grep config pointing to testdata rules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/sg-basic"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sg-basic/sgconfig.yml" << 'EOF'
          ruleDirs:
          - $GITHUB_WORKSPACE/action/testdata/rules
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean-src
          reporter: github-check
          level: error
          sg_config: ${{ github.workspace }}/tests/fixtures/sg-basic/sgconfig.yml
          fail_level: none

      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no findings"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

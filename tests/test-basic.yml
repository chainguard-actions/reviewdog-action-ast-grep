name: Test basic usage - no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy empty sgconfig fixture to workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/sgconfig-empty" "$GITHUB_WORKSPACE/sgconfig-test-empty"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: sgconfig-test-empty
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no errors (no findings expected)"
          echo "PASS"

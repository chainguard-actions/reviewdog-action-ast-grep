name: Test ast-grep basic usage with default config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          workdir: .
          reporter: local
          sg_config: sgconfig.yml
          fail_level: none
          level: info
          output_dir: /tmp/reviewdog-results

      - name: Assert action completed successfully
        run: |
          echo "Action ran ast-grep scan with default config using local reporter"
          echo "PASS"

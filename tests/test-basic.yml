name: Test basic usage - no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test workspace with clean code and sgconfig
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/basic/rules"

          # Create a simple rule that looks for a specific pattern
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/rules/no-console-log.yml" << 'EOF'
          id: no-console-log
          message: Do not use console.log
          severity: warning
          language: JavaScript
          rule:
            pattern: console.log($$$)
          EOF

          # Create sgconfig.yml pointing to our rules
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/sgconfig.yml" << 'EOF'
          ruleDirs:
          - ./rules
          EOF

          # Create a clean JS file with no console.log
          cat > "$GITHUB_WORKSPACE/tests/fixtures/basic/clean.js" << 'EOF'
          function hello() {
            return "hello world";
          }
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/basic
          sg_config: sgconfig.yml
          reporter: github-check
          level: warning
          fail_level: none
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no findings"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

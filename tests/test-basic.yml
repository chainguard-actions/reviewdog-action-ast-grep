name: Test basic usage - ast-grep finds issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sgconfig and rules for test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/rules"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sgconfig.yml" <<'EOF'
          ruleDirs:
          - ./rules
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/rules/no-context-todo.yml" <<'EOF'
          id: no-context-todo
          message: Do not use context.TODO in production code
          severity: error
          language: Go
          rule:
            pattern: context.TODO()
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sample.go" <<'EOF'
          package main

          import (
            "context"
            "fmt"
          )

          func main() {
            _ = context.TODO()
            fmt.Println("hello world")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none

      - name: Assert action ran (github-check reporter may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with github-check reporter)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test basic local reporter finds issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-project
          reporter: local
          filter_mode: nofilter
          output_dir: out-basic
      - name: Assert output file contains finding
        run: |
          OUT="$GITHUB_WORKSPACE/tests/fixtures/sg-project/out-basic/reviewdog-ast-grep"
          if [ ! -f "$OUT" ]; then
            echo "FAIL: output file $OUT not found"
            ls -la "$GITHUB_WORKSPACE/tests/fixtures/sg-project" || true
            exit 1
          fi
          echo "--- output ---"
          cat "$OUT"
          echo "--------------"
          if ! grep -q "app.js" "$OUT"; then
            echo "FAIL: expected finding for app.js"
            exit 1
          fi
          if ! grep -qi "console.log" "$OUT"; then
            echo "FAIL: expected rule message about console.log"
            exit 1
          fi
          echo "PASS"

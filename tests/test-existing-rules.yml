name: Test with existing rules - info severity findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/basic
          sg_config: sgconfig.yml
          reporter: local
          level: info
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # With fail_level=none, reviewdog always exits 0 regardless of findings
          # The basic fixture has a FIXME comment that triggers the no-fixme-comment rule
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action completed successfully with info-severity findings"
          else
            echo "FAIL: action did not complete successfully"
            exit 1
          fi

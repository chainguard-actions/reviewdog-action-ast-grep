name: Test basic finding with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-project
          reporter: local
          filter_mode: nofilter
          output_dir: /tmp/rd-basic
      - name: Assert step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert output file contains the finding
        run: |
          F=/tmp/rd-basic/reviewdog-ast-grep
          if [ ! -f "$F" ]; then
            echo "FAIL: output file $F not found"
            ls -la /tmp/rd-basic || true
            exit 1
          fi
          echo "--- output ---"
          cat "$F"
          if ! grep -q "Avoid console.log in production code" "$F"; then
            echo "FAIL: expected rule message in output"
            exit 1
          fi
          if ! grep -q "app.js" "$F"; then
            echo "FAIL: expected app.js in output"
            exit 1
          fi
          echo "PASS"

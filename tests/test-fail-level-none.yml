name: Test ast-grep fail_level none - always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fail_level=none (should not fail even with findings)
        id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          workdir: .
          reporter: local
          sg_config: sgconfig.yml
          fail_level: none
          level: info
          output_dir: /tmp/reviewdog-results

      - name: Assert action did not fail despite findings in testdata
        run: |
          echo "Action completed with fail_level=none - exit code should be 0 even with findings"
          echo "PASS"

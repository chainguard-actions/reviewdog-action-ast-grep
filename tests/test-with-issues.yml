name: Test with issues found - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/withissues
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          filter_mode: nofilter
          # fail_level=none means the action exits 0 even when issues are found
          fail_level: none

      - name: Assert action completed without error despite issues
        run: |
          echo "PASS: action ran with fail_level=none and did not fail even with issues present"

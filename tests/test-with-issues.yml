name: Test with issues found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ast-grep action on code with issues
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/with-issues
          sg_config: sgconfig.yml
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action completed (issues found but fail_level=none)
        run: |
          echo "PASS: action completed with fail_level=none even when issues exist"

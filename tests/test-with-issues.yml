name: Test with issues found in testdata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          workdir: testdata
          sg_config: ../sgconfig.yml
          fail_level: none
          level: error
        continue-on-error: true

      - name: Assert action ran successfully
        run: |
          echo "Action completed (issues found are expected in testdata)"
          echo "PASS: action ran with testdata containing known issues"

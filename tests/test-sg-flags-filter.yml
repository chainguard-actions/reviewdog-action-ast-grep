name: Test sg_flags filter restricts rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg
          reporter: local
          filter_mode: nofilter
          sg_flags: --filter no-console-log
          output_dir: /tmp/rd-sg-flags
      - name: Assert only filtered rule reported
        run: |
          f=/tmp/rd-sg-flags/reviewdog-ast-grep
          if [ ! -f "$f" ]; then
            echo "FAIL: output file $f not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$f"
          echo "--------------"
          if ! grep -q "Avoid console.log in fixture code" "$f"; then
            echo "FAIL: console.log finding missing"
            exit 1
          fi
          if grep -q "Remove debugger statement" "$f"; then
            echo "FAIL: debugger rule should have been filtered out"
            exit 1
          fi
          echo "PASS"

name: Test sg_flags restricts rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/tests/fixtures/sg-project/rd-out-filter"
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-project
          reporter: local
          filter_mode: nofilter
          sg_version: 0.51.3
          sg_flags: --filter no-console-log
          output_dir: rd-out-filter
      - name: Assert only the filtered rule is reported
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/sg-project/rd-out-filter/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: output file $F not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$F"
          echo "--------------"
          if ! grep -q "Avoid console.log" "$F"; then
            echo "FAIL: expected console.log finding"
            exit 1
          fi
          if grep -q "Avoid debugger" "$F"; then
            echo "FAIL: debugger rule should have been filtered out"
            exit 1
          fi
          echo "PASS"

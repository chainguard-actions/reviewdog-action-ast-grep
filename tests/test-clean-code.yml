name: Test with clean code (no findings)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/sgconfig-clean
          sg_config: sgconfig.yml
          reporter: github-check
          level: error
          fail_level: none
      - name: Assert action succeeded with no findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action completed successfully with no findings"

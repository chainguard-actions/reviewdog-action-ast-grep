name: Test clean code produces no findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/sg-clean
          reporter: local
          filter_mode: nofilter
          fail_level: any
          output_dir: ${{ github.workspace }}/rd-out-clean
      - name: Assert no findings
        run: |
          F="$GITHUB_WORKSPACE/rd-out-clean/reviewdog-ast-grep"
          if [ ! -f "$F" ]; then
            echo "FAIL: output file $F not found"
            exit 1
          fi
          echo "--- output ---"
          cat "$F"
          if grep -q "console.log" "$F"; then
            echo "FAIL: unexpected finding in clean code"
            exit 1
          fi
          echo "PASS"
